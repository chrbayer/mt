<?xml version="1.0" encoding="UTF-8"?>
<!-- Adaptive-icon foreground, 1024x1024 and transparent. Android shows only
     the central 66% of this canvas, so the mark is scaled to 0.7 around the
     centre to stay clear of every mask shape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(0.7) translate(-512 -508)">
    <g fill="#FFFFFF">
      <rect x="312" y="372" width="400" height="96" rx="48"/>
      <rect x="464" y="220" width="96" height="400" rx="48"/>
    </g>
    <rect x="312" y="700" width="400" height="96" rx="48" fill="#FFC53D"/>
  </g>
</svg>
