Categories:
  - Science & Education
License: GPL-3.0-or-later
AuthorName: Christoph Bayer
SourceCode: https://github.com/chrbayer/mt
IssueTracker: https://github.com/chrbayer/mt/issues

AutoName: Mathe-Trainer

RepoType: git
Repo: https://github.com/chrbayer/mt.git

Builds:
  - versionName: 2.13.6
    versionCode: 21306
    commit: 3733620d41e20d325ed193cd1547182bae5f8229
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=MT_VERSION=$$VERSION$$

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.13.6
CurrentVersionCode: 21306
