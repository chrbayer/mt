Categories:
  - Science & Education
License: GPL-3.0-or-later
AuthorName: Christoph Bayer
SourceCode: https://github.com/chrbayer/mt
IssueTracker: https://github.com/chrbayer/mt/issues

RepoType: git
Repo: https://github.com/chrbayer/mt.git

Builds:
  - versionName: 2.13.4
    versionCode: 21304
    commit: v2.13.4
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.4
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=MT_VERSION=$$VERSION$$

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.13.4
CurrentVersionCode: 21304
